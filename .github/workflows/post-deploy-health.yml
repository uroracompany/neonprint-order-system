name: Post-deploy Production health

on:
  deployment_status:

permissions: {}

jobs:
  validate-current-production-deployment:
    name: Validate latest Production deployment
    if: >-
      github.repository == 'uroracompany/neonprint-order-system' &&
      (github.event.deployment.environment == 'Production – neonprint-order-system' ||
      github.event.deployment_status.environment == 'Production – neonprint-order-system')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    timeout-minutes: 6
    outputs:
      outcome: ${{ steps.event.outputs.outcome }}
      smoke_url: ${{ steps.event.outputs.smoke_url }}
      sha: ${{ steps.event.outputs.sha }}
      deployment_id: ${{ steps.event.outputs.deployment_id }}
      status_id: ${{ steps.event.outputs.status_id }}
      current: ${{ steps.latest.outputs.current }}
    steps:
      - name: Check out trusted default branch controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate deployment event and immutable target
        id: event
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/post-deploy-health.mjs classify
      - name: Confirm this is still the latest Production deployment
        id: latest
        if: steps.event.outputs.outcome == 'smoke' || steps.event.outputs.outcome == 'deployment-failed'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/post-deploy-health.mjs check-latest
      - name: Report Vercel Production deployment failure
        if: steps.latest.outputs.current == 'true' && steps.event.outputs.outcome == 'deployment-failed'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/post-deploy-health.mjs report-deployment-failure
  smoke:
    name: Anonymous Production shell smoke
    needs: validate-current-production-deployment
    if: needs.validate-current-production-deployment.result == 'success' && needs.validate-current-production-deployment.outputs.outcome == 'smoke' && needs.validate-current-production-deployment.outputs.current == 'true'
    runs-on: ubuntu-24.04
    # This public-repository checkout needs source read access only. In
    # particular, this job does not receive the deployments:read capability
    # used by the controller above.
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - name: Check out trusted default branch smoke code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run anonymous read-only Production shell smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ needs.validate-current-production-deployment.outputs.smoke_url }}
          POST_DEPLOY_EXPECTED_SHA: ${{ needs.validate-current-production-deployment.outputs.sha }}
          POST_DEPLOY_EXPECTED_DEPLOYMENT_ID: ${{ needs.validate-current-production-deployment.outputs.deployment_id }}
          POST_DEPLOY_EXPECTED_STATUS_ID: ${{ needs.validate-current-production-deployment.outputs.status_id }}
        run: npm run test:e2e:production-health
      - name: Add manual recovery details when smoke setup or browser test fails
        if: failure()
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/post-deploy-health.mjs report-failure
