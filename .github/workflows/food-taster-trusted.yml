name: Food Taster Trusted Controller

on:
  workflow_run:
    workflows:
      - Food Taster
    types:
      - completed

permissions: {}

jobs:
  validate-pull-request:
    name: Validate current pull request
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.prepare.outputs.number }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      head_repo: ${{ steps.prepare.outputs.head_repo }}
      run_id: ${{ steps.prepare.outputs.run_id }}
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate current GitHub metadata
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/food-taster-github.mjs prepare

  start-food-taster-gate:
    name: Start trusted Food Taster Check Run
    needs: validate-pull-request
    runs-on: ubuntu-24.04
    environment:
      name: food-taster-publisher
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      check_run_id: ${{ steps.create.outputs.check_run_id }}
    steps:
      - name: Require dedicated GitHub App credentials
        env:
          APP_ID: ${{ vars.FOOD_TASTER_GITHUB_APP_ID }}
          APP_CLIENT_ID: ${{ vars.FOOD_TASTER_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FOOD_TASTER_GITHUB_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" || { echo "Food Taster publisher App ID is missing."; exit 1; }
          test -n "$APP_CLIENT_ID" || { echo "Food Taster publisher App client ID is missing."; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "Food Taster publisher App private key is missing."; exit 1; }
      - name: Check out trusted default-branch controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Create narrowly scoped installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FOOD_TASTER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FOOD_TASTER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Create Food Taster gate Check Run
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FOOD_TASTER_GITHUB_APP_ID: ${{ vars.FOOD_TASTER_GITHUB_APP_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate-pull-request.outputs.number }}
          PR_HEAD_SHA: ${{ needs.validate-pull-request.outputs.head_sha }}
          PR_HEAD_REPO: ${{ needs.validate-pull-request.outputs.head_repo }}
          TRUSTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/food-taster-github.mjs create-check

  quality:
    name: Quality checks on exact PR head
    needs:
      - validate-pull-request
      - start-food-taster-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.validate-pull-request.outputs.head_repo }}
          ref: ${{ needs.validate-pull-request.outputs.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check security configuration
        run: npm run security:check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        env:
          VITE_SUPABASE_URL: https://food-taster.invalid
          VITE_SUPABASE_ANON_KEY: food-taster-placeholder
        run: npm run test -- --maxWorkers=2
      - name: Build
        env:
          VITE_SUPABASE_URL: https://food-taster.invalid
          VITE_SUPABASE_ANON_KEY: food-taster-placeholder
        run: npm run build
      - name: Install Chromium for local smoke
        run: npx playwright install --with-deps chromium
      - name: Smoke test exact PR build on loopback
        env:
          CI: true
          VITE_SUPABASE_URL: https://food-taster.invalid
          VITE_SUPABASE_ANON_KEY: food-taster-placeholder
        run: npm run test:e2e:smoke

  publish-food-taster-gate:
    name: Finalize trusted Food Taster Check Run
    if: always() && needs.start-food-taster-gate.result == 'success'
    needs:
      - validate-pull-request
      - start-food-taster-gate
      - quality
    runs-on: ubuntu-24.04
    environment:
      name: food-taster-publisher
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Require dedicated GitHub App credentials
        env:
          APP_ID: ${{ vars.FOOD_TASTER_GITHUB_APP_ID }}
          APP_CLIENT_ID: ${{ vars.FOOD_TASTER_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FOOD_TASTER_GITHUB_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" || { echo "Food Taster publisher App ID is missing."; exit 1; }
          test -n "$APP_CLIENT_ID" || { echo "Food Taster publisher App client ID is missing."; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "Food Taster publisher App private key is missing."; exit 1; }
      - name: Check out trusted default-branch controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Create narrowly scoped installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FOOD_TASTER_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FOOD_TASTER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Revalidate current PR and finalize Check Run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FOOD_TASTER_GITHUB_APP_ID: ${{ vars.FOOD_TASTER_GITHUB_APP_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate-pull-request.outputs.number }}
          PR_HEAD_SHA: ${{ needs.validate-pull-request.outputs.head_sha }}
          PR_HEAD_REPO: ${{ needs.validate-pull-request.outputs.head_repo }}
          CHECK_RUN_ID: ${{ needs.start-food-taster-gate.outputs.check_run_id }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: node scripts/food-taster-github.mjs finalize
