name: Food Taster

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check security configuration
        run: npm run security:check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        env:
          VITE_SUPABASE_URL: https://food-taster.invalid
          VITE_SUPABASE_ANON_KEY: food-taster-placeholder
        run: npm run test -- --maxWorkers=2
      - name: Build
        env:
          VITE_SUPABASE_URL: https://food-taster.invalid
          VITE_SUPABASE_ANON_KEY: food-taster-placeholder
        run: npm run build
      - name: Install Chromium for local smoke
        run: npx playwright install --with-deps chromium
      - name: Smoke test exact PR build on loopback
        env:
          CI: true
          VITE_SUPABASE_URL: https://food-taster.invalid
          VITE_SUPABASE_ANON_KEY: food-taster-placeholder
        run: npm run test:e2e:smoke
